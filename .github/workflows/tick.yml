name: Ticker

# Keeps posting on time without relying on GitHub's cron (which often runs hours late or not at all).
# Each run loops for ~5 h: every 10 minutes it builds the day's posts if missing and publishes whatever
# is due, then it starts a fresh run of itself. The hourly schedule only restarts the chain if it breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: ticker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post on time (loop ~5 hours)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          LI_TOKEN: ${{ secrets.LI_TOKEN }}
          LI_PERSON_URN: ${{ secrets.LI_PERSON_URN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          git config user.name "hbe-social-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 290*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase || true
            D=$(TZ=Asia/Kolkata date +%F)
            # Build only from 06:00 IST: by then the US session has closed and NSE has published the day's data.
            # (Building just after midnight used the previous day's closes.)
            if [ ! -f "posts/$D/plan.json" ] && [ "$(TZ=Asia/Kolkata date +%H)" -ge 6 ]; then
              python -c "import market_posts; market_posts.update_all()" || true
              python daily.py "$D" || true
            fi
            # Sunday: remind Hitesh (GitHub issue -> email / app notification) to schedule next week's X pack
            NEXT=$(TZ=Asia/Kolkata date -d "next monday" +%F)
            if [ "$(TZ=Asia/Kolkata date +%u)" = 7 ] && [ -f "posts/x-week-$NEXT/README.md" ] && [ ! -f "posts/x-week-$NEXT/.reminded" ]; then
              GH_TOKEN=${{ github.token }} gh issue create -R ${{ github.repository }} --assignee hitesheidnani \
                --title "📅 Schedule this week's X posts (week of $NEXT)" \
                --body "21 posts are ready (3 a day). Open the pack, copy each post into X's scheduler (Post → calendar icon), attach the image, schedule. About 15 minutes. Close this issue when done.

          👉 https://github.com/${{ github.repository }}/blob/main/posts/x-week-$NEXT/README.md" && touch "posts/x-week-$NEXT/.reminded"
            fi
            # publish everything due (one post per call; loop until nothing is due)
            for i in 1 2 3; do python publish.py | tee /tmp/out.txt || true; grep -q "Nothing due" /tmp/out.txt && break; done
            git add posts data/indices
            git diff --cached --quiet || git commit -q -m "posts: ticker $(TZ=Asia/Kolkata date '+%F %H:%M')"
            git pull -q --rebase && git push -q || true
            sleep 600
          done
      - name: Hand over to a fresh run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tick.yml -R ${{ github.repository }}
