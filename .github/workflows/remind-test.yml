name: Test reminder
on: workflow_dispatch
permissions:
  issues: write
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R ${{ github.repository }} --assignee hitesheidnani \
            --title "🔔 Test: this is how your Sunday X reminder will look" \
            --body "If you got this on your phone or email, the weekly reminder works. Every Sunday you'll get one like this with a link to that week's X posts. You can close this test now."
