name: Diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL -m 30 -A "HBECapitalBot/1.0 (+https://hbecapital.net)" -o h.html -w "bot-ua %{http_code} %{size_download}\n" https://www.thechartreport.com/
          curl -sL -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -o h2.html -w "browser-ua %{http_code} %{size_download}\n" https://www.thechartreport.com/
          grep -c "thechartreport.com/1[01]-" h.html h2.html || true
          head -c 300 h.html
