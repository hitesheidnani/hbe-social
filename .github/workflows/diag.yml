name: Diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python partner_fetch.py
          ls -la partner_charts partner_charts/inbox
          python -c "
          import partner_fetch as p, tempfile
          print('PICK', p.pick(tempfile.mkdtemp()))"
