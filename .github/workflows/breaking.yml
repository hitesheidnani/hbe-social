name: Post market news now

# Run from the GitHub app or website: Actions -> Post market news now -> Run workflow.
# The post goes to Instagram, Facebook and LinkedIn within about 10 minutes.
on:
  workflow_dispatch:
    inputs:
      headline:
        description: "Headline (short), e.g. RBI cuts repo rate by 25 bps"
        required: true
      points:
        description: "2-4 short facts separated by |"
        required: true
      meaning:
        description: "Optional: one line on what it means for investors (no advice)"
        required: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          HEADLINE: ${{ inputs.headline }}
          POINTS: ${{ inputs.points }}
          MEANING: ${{ inputs.meaning }}
        run: python breaking.py "$HEADLINE" "$POINTS" "$MEANING"
      - run: |
          git config user.name "hbe-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git commit -q -m "posts: news $(TZ=Asia/Kolkata date '+%F %H:%M')"
          git pull -q --rebase && git push -q
