name: Publish to Instagram

# GitHub can start scheduled runs late; a late run simply posts what is due.
on:
  schedule:
    # Every 15 minutes, 07:37-21:22 IST, at off-peak minutes. GitHub's scheduler often runs late or
    # skips busy times, so frequent checks make sure each slot goes out close to its time.
    - cron: "7,22,37,52 2-15 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Post this slot now (update, psych, market, long, edu, feature, short). Blank = whatever is due"
        required: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build today's posts if the morning build did not run
        run: |
          D=$(TZ=Asia/Kolkata date +%F)
          if [ ! -f "posts/$D/plan.json" ]; then
            python -c "import market_posts; market_posts.update_all()" || true
            python daily.py "$D"
          fi
      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          LI_TOKEN: ${{ secrets.LI_TOKEN }}
          LI_PERSON_URN: ${{ secrets.LI_PERSON_URN }}
        run: python publish.py ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }}
      - name: Record result
        if: always()
        run: |
          git config user.name "hbe-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts data/indices
          git diff --cached --quiet || git commit -m "posts: publish log $(TZ=Asia/Kolkata date '+%F %H:%M')"
          git pull --rebase && git push
