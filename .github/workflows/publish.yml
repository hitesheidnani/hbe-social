name: Publish to Instagram

# 09:00, 12:30, 15:00, 17:30 and 20:00 IST. Each run posts the earliest due, unposted slot.
# GitHub can start scheduled runs late; a late run simply posts what is due.
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 7 * * *"
    - cron: "30 9 * * *"
    - cron: "0 12 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Post this slot now (psych, long, edu, feature, short). Blank = whatever is due"
        required: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python publish.py ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }}
      - name: Record result
        if: always()
        run: |
          git config user.name "hbe-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "posts: publish log $(TZ=Asia/Kolkata date '+%F %H:%M')"
          git pull --rebase && git push
