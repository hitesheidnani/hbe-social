name: Build daily posts

# ~06:00 IST, after FundNavigator's nightly refresh (23:30 IST) has deployed. Two tries at off-peak
# minutes; the publish workflow also builds the day's posts itself if neither ran.
on:
  schedule:
    - cron: "13 0 * * *"
    - cron: "43 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to build (YYYY-MM-DD, IST). Blank = today"
        required: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh Nifty index history (NSE)
        run: python -c "import market_posts; market_posts.update_all()"
        continue-on-error: true
      - name: Build posts
        run: |
          D="${{ inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Kolkata date +%F)
          # a scheduled re-run must not rebuild a day that is already being posted
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "posts/$D/plan.json" ]; then echo "already built"; exit 0; fi
          python daily.py "$D"
      - name: Commit images and plan
        run: |
          git config user.name "hbe-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts data/indices
          git diff --cached --quiet || git commit -m "posts: build $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase && git push
