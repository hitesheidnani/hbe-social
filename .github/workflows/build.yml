name: Build daily posts

# 06:00 IST: after FundNavigator's nightly refresh (23:30 IST) has deployed.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to build (YYYY-MM-DD, IST). Blank = today"
        required: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build posts
        run: python daily.py ${{ inputs.date }}
      - name: Commit images and plan
        run: |
          git config user.name "hbe-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "posts: build $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase && git push
